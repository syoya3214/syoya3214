name: Contribution Card

on:
  schedule: # 03:17 JST
    - cron: "17 18 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/gen_card.py", ".github/workflows/contrib-card.yml"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Generate card
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
        run: python3 scripts/gen_card.py
      - name: Commit & Push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add assets/contrib-card.svg
          if git commit -m "update contribution card"; then
            git push
          fi
