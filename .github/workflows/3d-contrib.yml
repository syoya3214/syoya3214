name: GitHub-Profile-3D-Contrib

on:
  schedule: # 03:00 JST
    - cron: "0 18 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/3d-contrib.yml"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          # PROFILE_TOKEN (PAT) があれば非公開リポジトリの分も集計される
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
      - name: Remove language pie chart
        run: |
          python3 - <<'EOF'
          import glob
          import xml.etree.ElementTree as ET
          ET.register_namespace("", "http://www.w3.org/2000/svg")
          for f in glob.glob("profile-3d-contrib/*.svg"):
              tree = ET.parse(f)
              root = tree.getroot()
              for g in list(root):
                  if g.tag.endswith("g") and (g.get("transform") or "").replace(" ", "").startswith("translate(40,"):
                      root.remove(g)
              tree.write(f)
          EOF
      - name: Commit & Push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A .
          if git commit -m "generated"; then
            git push
          fi
